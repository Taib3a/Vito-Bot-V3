<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#07080c" />
<title>STARX — استوديو الصور بالذكاء الاصطناعي</title>
<meta name="description" content="حوّل فكرتك إلى صورة: توليد، تغيير خلفية، إضاءة، ظلال، وتعديل المشهد." />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="topbar">
  <a class="brand" href="#/">
    <span class="brand-mark">S</span>
    <span class="brand-name">STAR<span>X</span></span>
    <span class="brand-sub">استوديو الصور</span>
  </a>

  <div class="status" id="status" title="حالة الاتصال">
    <i class="dot"></i><span id="statusText">جارٍ الاتصال</span>
  </div>
</header>

<div class="shell">
  <aside class="rail">
    <p class="rail-title">الأدوات</p>
    <nav id="toolNav" class="rail-nav"></nav>
    <div class="rail-foot">
      <span class="badge" id="modeBadge">تجريبي</span>
      <p>ارفع صورة أو اكتب وصفاً وابدأ.</p>
    </div>
  </aside>

  <main class="stage">
    <section class="workspace">
      <div class="headline">
        <p class="eyebrow" id="eyebrow">IMAGE STUDIO</p>
        <h1 id="title">حوّل فكرتك إلى صورة</h1>
        <p class="sub" id="hint">اكتب وصفاً واضحاً، وسيقوم STAR X AI بإنشاء الصورة.</p>
      </div>

      <div class="composer">
        <label class="drop" id="drop" hidden>
          <input type="file" id="file" accept="image/*" hidden />
          <img id="preview" alt="" hidden />
          <div class="drop-empty" id="dropEmpty">
            <strong>اسحب صورة هنا</strong>
            <span>أو اضغط للاختيار · PNG / JPG · حتى 10 ميجابايت</span>
          </div>
          <button type="button" class="drop-clear" id="dropClear" hidden>إزالة</button>
        </label>

        <div class="field">
          <textarea id="prompt" maxlength="2000" rows="4"
            placeholder="مثال: صورة منتج عطر على حجر رخامي، إضاءة ناعمة من الجانب، خلفية داكنة."></textarea>
          <div class="field-bar">
            <span class="counter"><b id="count">0</b> / 2000</span>
            <span class="kbd">Ctrl + Enter للتوليد</span>
          </div>
        </div>

        <div class="controls">
          <div class="group" role="group" aria-label="الأبعاد">
            <span class="group-label">الأبعاد</span>
            <div class="chips" id="ratios"></div>
          </div>
          <div class="group">
            <span class="group-label">العدد</span>
            <div class="chips" id="counts"></div>
          </div>
          <button class="run" id="run">
            <span class="run-label">توليد</span>
            <span class="run-spin" aria-hidden="true"></span>
          </button>
        </div>
      </div>

      <div class="results-head">
        <h2>النتائج</h2>
        <button class="ghost" id="clearAll" hidden>مسح الكل</button>
      </div>
      <div class="results" id="results"></div>
      <div class="empty" id="empty">
        <p class="empty-title">لا توجد نتائج بعد</p>
        <p class="empty-sub">جرّب أحد هذه الأوصاف:</p>
        <div class="suggest" id="suggest"></div>
      </div>
    </section>
  </main>
</div>

<div class="toast" id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
