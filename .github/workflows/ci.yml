name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref so a stale push never blocks a newer one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: build + test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json declares engines.node >=22. Both are tested so the
        # claim stays honest — node:sqlite must be available on each.
        node: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check every source file
        run: |
          find index.js database الاضافات الاوامر -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Load commands, anti-features and the database
        run: |
          node --input-type=module -e "
          process.env.BOT_DB_PATH = '/tmp/ci.db';
          const { loadCommands } = await import('./الاضافات/المحمل.js');
          const { loadAntiFeatures } = await import('./الاضافات/محمل-المضاد.js');
          const db = await import('./database/db.js');
          const commands = await loadCommands();
          const anti = await loadAntiFeatures();
          if (Object.keys(commands).length === 0) throw new Error('no commands loaded');
          if (anti.length === 0) throw new Error('no anti-features loaded');
          await db.registerGroup('1@g.us', 'CI');
          console.log('ok:', Object.keys(commands).length, 'commands,', anti.length, 'anti-features');
          process.exit(0);
          "
