name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref so a stale push never blocks a newer one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: build + test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json declares engines.node >=22. Both are tested so the
        # claim stays honest — node:sqlite must be available on each.
        node: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # ffmpeg/ffprobe are system requirements for the VoIP media pipeline
      # (see Famiglia/اضافات/محركات.js), so CI mirrors production.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # No lock file is committed (the server installs dependencies itself),
      # so we use `npm install` instead of `npm ci` — the latter requires a lock.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax-check every source file
        run: |
          find index.js Famiglia -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Verify VoIP requirements are detectable
        run: |
          node --input-type=module -e "
          const { hasFfmpeg, hasFfprobe, missingRequirements } = await import('./Famiglia/اضافات/محركات.js');
          if (!(await hasFfmpeg())) throw new Error('ffmpeg missing');
          if (!(await hasFfprobe())) throw new Error('ffprobe missing');
          const missing = await missingRequirements({ media: true });
          if (missing.length) throw new Error('missing: ' + missing.join(','));
          console.log('voip requirements ok');
          process.exit(0);
          "

      - name: Load every plugin and round-trip the database
        run: |
          node --input-type=module -e "
          process.env.BOT_DB_PATH = '/tmp/ci.db';
          const { loadPlugins, getPlugins } = await import('./Famiglia/Corleone/pluginLoader.js');
          const { db } = await import('./Famiglia/database/db.js');
          await loadPlugins();
          const plugins = getPlugins();
          if (plugins.size === 0) throw new Error('no plugins loaded');
          db.setUser('123@s.whatsapp.net', { role: 'owner' });
          db.setGroup('1@g.us', { antilink: true });
          db.setBot('1@s.whatsapp.net', { label: 'CI' });
          if (!db.hasRole('123', 'owner')) throw new Error('hasRole failed');
          if (!db.getGroup('1@g.us').antilink) throw new Error('group round-trip failed');
          console.log('ok:', plugins.size, 'aliases loaded');
          process.exit(0);
          "
